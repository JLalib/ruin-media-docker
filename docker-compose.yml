version: '3.8'
services:
  ruin-media:
    image: korosys/ruin.media:latest
    container_name: ruin-media
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3